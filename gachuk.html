<style>
  :root{--navy:#1a365d;--navy2:#2b4a74;--line:#d9e1ec;--muted:#6b7a90;--warn:#c05621;--ok:#2f855a;--err:#c53030;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1c2b3a;background:#f4f6f9;font-size:14px;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:11px 16px;position:sticky;top:0;z-index:30;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:9px 16px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:var(--navy);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}

  td.auto{background:#f3f7f3;font-weight:800;color:#1c6b3a;}

  tr.cur td.auto{background:#eef6ee;}

  td input[readonly]{background:#f2f4f7;color:#52627a;border-color:#e2e8f0;}

  details.basecard>summary{list-style:none;cursor:pointer;font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;}

  details.basecard>summary::after{content:"열기 ▾";margin-left:auto;font-size:13px;font-weight:700;color:#2b6cb0;}

  .chk.good{background:#f0fff4;border-color:#9ae6b4;color:#276749;}

  @media print{ header,.noprint{display:none!important;} body{background:#fff;font-size:11px;} .card,details.basecard{box-shadow:none;border:none;padding:0;margin:0 0 10px;} details.basecard[open] .basebody,details.basecard .basebody{display:block;} main{padding:0;max-width:none;} table{font-size:10px;} th,td{padding:3px 4px;} }

<body>
<header><div class="hrow">
  <a class="back" href="#" onclick="leave();return false" aria-label="뒤로">←</a>
  <div><h1>📋 가축동향조사표</h1><div class="hsub" id="hSub"></div></div>
  <a class="home" href="index.html">🏠 두당홈</a>
</div></header>

<main>
  <div class="card noprint">
    <div class="chips" id="chips">
      <button class="chip on" data-sp="pig">🐖 돼지</button>
      <button class="chip" data-sp="chicken">🐔 닭</button>
      <button class="chip" data-sp="duck">🦆 오리</button>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      <div class="fld"><label>조사연도</label><input id="year" type="number" min="2020" max="2100" value="2026"></div>
      <div class="fld"><label>조사월(입력 대상)</label><select id="period">
        <option value="prev12">전년 12월</option><option value="m3">3월</option><option value="m6" selected>6월</option><option value="m9">9월</option><option value="m12">12월</option></select></div>
      <div class="fld" style="grid-column:span 2"><label>농장명(조사대장번호로 식별 권장)</label><input id="farm" placeholder="예) 행복농장" autocomplete="off"></div>
    </div>
    <div class="btnrow" style="margin-top:10px">
      <button class="btn g" id="btnSave">💾 저장</button>
      <select id="loadList" style="max-width:220px"><option value="">— 저장 농가·연도 불러오기 —</option></select>
      <button class="btn" id="btnLoad">📂 불러오기</button>
      <button class="btn" id="btnDel">🗑 삭제</button>
      <button class="btn o" id="btnInspect">🔍 내검</button>
      <button class="btn p" id="btnPrint">🖨 인쇄/PDF</button>
      <button class="btn" id="btnXlsx">📊 Excel</button>
      <button class="btn" id="btnCsv">📄 CSV</button>
    </div>
  </div>

  <!-- 농가 기본정보 (기본 닫힘) -->
  <details class="basecard card" id="baseCard">
    <summary><span class="num" style="background:var(--navy);color:#fff;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px">1</span> 농가 기본정보 <span class="sub" id="baseSummary"></span></summary>
    <div class="basebody">
      <div class="grid" id="baseGrid"></div>
    </div>
  </details>

  <div id="tables"></div>

  <div class="card noprint">
    <div class="lb"><span class="num" id="numChk">4</span>자동 내검 <span class="sub">임계값은 소속기관 기준으로 조정 가능</span></div>
    <div id="chkBox"><div class="sub">🔍 내검 버튼을 누르거나 값을 입력하면 자동으로 검토합니다.</div></div>
  </div>
</main>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CKEY="dudang!cache$2026#key";
function encStr(s){ try{ let o=""; for(let i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^CKEY.charCodeAt(i%CKEY.length)); return "ENC1:"+btoa(unescape(encodeURIComponent(o))); }catch(e){ return s; } }
function decStr(s){ if(typeof s!=="string"||s.slice(0,5)!=="ENC1:") return s; try{ const raw=decodeURIComponent(escape(atob(s.slice(5)))); let o=""; for(let i=0;i<raw.length;i++) o+=String.fromCharCode(raw.charCodeAt(i)^CKEY.charCodeAt(i%CKEY.length)); return o; }catch(e){ return "{}"; } }
const $=id=>document.getElementById(id);
const nf=v=>(v||v===0)?Number(v).toLocaleString():"";
function toast(m,ms){ const t=$("toast"); t.textContent=m; t.style.opacity="1"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity="0",ms||2200); }
function leave(){ if(history.length>1) history.back(); else location.href="index.html"; }
const esc=s=>String(s==null?"":s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();

const PERIODS=[["prev12","전년 12월"],["m3","3월 조사"],["m6","6월 조사"],["m9","9월 조사"],["m12","12월 조사"]];
const prevOf={prev12:null,m3:"prev12",m6:"m3",m9:"m6",m12:"m9"};

/* 공통 농가 기본정보 필드 */
const BASE_COMMON=[
 ["ledgerNo","조사대장번호",""],["sido","시도",""],["sigungu","시군구",""],["emd","읍면동",""],
 ["addr","농장주소","span2"],["owner","경영주명",""],["ownerTel","경영주 연락처",""],["mgr","관리인명",""],["mgrTel","관리인 연락처",""],
 ["method","조사방법","sel:방법"],["note","비고","span2"]
];
const METHOD_OPTS=[["01","면접(01)"],["03","전화(03)"],["04","E-mail(04)"],["05","FAX(05)"],["06","기타(06)"],["07","SASI(07)"]];
const CHANGE_PIG=[["01","유축(01)"],["05","휴업(05)"],["06","전출(06)"],["07","폐업(07)"],["08","기타(08)"],["09","합산조사(09)"]];
const CHANGE_FOWL=[["03","전수(03)"],["04","규모(04)"],["05","휴업(05)"],["06","전출(06)"],["07","폐업(07)"],["08","기타(08)"]];
const BREEDUSE=[["01","육용종계(01)"],["02","육용원종계(02)"],["03","산란종계(03)"],["04","산란원종계(04)"],["05","토종닭종계(05)"],["06","토종닭원종계(06)"]];

/* ===== 축종별 설정 ===== */
const SPCFG={
 pig:{ label:"돼지", unit:"두", change:CHANGE_PIG, baseExtra:[],
   tables:[
     {id:"head",title:"사육마릿수 (월령·성별)",total:true,
      cols:[{k:"u2",l:"2개월 미만<br><span class='sub'>포유+이유</span>",sum:1},{k:"g24",l:"2~4개월<br><span class='sub'>육성</span>",sum:1},{k:"b46",l:"4~6개월<br><span class='sub'>비육</span>",sum:1},{k:"m68",l:"6~8개월<br>수컷",sum:1},{k:"f68",l:"6~8개월<br>암컷",sum:1},{k:"cand",l:"└그중 후보돈<br><span class='sub'>(합계 제외)</span>"},{k:"boar",l:"8개월↑ 수컷<br><span class='sub'>종돈</span>",sum:1},{k:"sow",l:"8개월↑ 암컷<br><span class='sub'>모돈</span>",sum:1}],
      note:"합계 = 2개월미만+2~4+4~6+6~8(수+암)+8개월이상(수+암). <b>후보돈은 6~8개월 암컷의 \"그 중\" 값이므로 합계에 다시 더하지 않습니다.</b>"},
     {id:"prod",title:"과거 3개월 생산·폐사 / 분만·임신 모돈",
      cols:[{k:"prod",l:"생산<br><span class='sub'>과거3개월</span>"},{k:"dead",l:"폐사<br><span class='sub'>과거3개월</span>"},{k:"farrow",l:"분만모돈<br><span class='sub'>과거3개월</span>"},{k:"preg1",l:"임신 1개월전"},{k:"preg2",l:"임신 2개월전"},{k:"preg3",l:"임신 3개월전"},{k:"pregTot",l:"임신 계<br><span class='sub'>자동</span>",auto:["preg1","preg2","preg3"]}],
      note:"임신모돈 계 = 1개월전+2개월전+3개월전. 과거 3개월: 3월조사=전년12·1·2월 / 6월=3·4·5월 / 9월=6·7·8월 / 12월=9·10·11월."}
   ], inspect:pigInspect },

 chicken:{ label:"닭", unit:"수", change:CHANGE_FOWL, baseExtra:[["breedUse","종계용도","sel:종계"]],
   tables:[
     {id:"head",title:"사육마릿수",total:true,
      groups:[["육계",2],["삼계",2],["토종닭",2],["산란계",3],["계란",2]],
      cols:[{k:"c1u",l:"1개월미만",sum:1},{k:"c1o",l:"1개월이상",sum:1},{k:"s1u",l:"1개월미만",sum:1},{k:"s1o",l:"1개월이상",sum:1},{k:"t70u",l:"70일미만",sum:1},{k:"t70o",l:"70일이상",sum:1},{k:"l3u",l:"3개월미만",sum:1},{k:"l36",l:"3~6개월",sum:1},{k:"l6o",l:"6개월이상",sum:1},{k:"eggProd",l:"1일평균<br>식용계란"},{k:"eggRate",l:"생산가담율<br>(%)",pct:1}],
      note:"합계 = 종계 + 산란계 + 육용계(육계·삼계·토종닭). <b>1일평균 식용계란 생산량·계란 생산가담율(%)은 수량/비율이므로 합계에 포함하지 않습니다.</b> 가담율 = 3~6개월 중 산란한 마리 ÷ 3~6개월 전체 ×100."},
     {id:"breed",title:"종계 (종계용도별 · 암♀/수♂)",
      groups:[["종계 암컷♀",3],["종계 수컷♂",3]],
      cols:[{k:"bf3u",l:"3개월미만",sum:1},{k:"bf36",l:"3~6개월",sum:1},{k:"bf6o",l:"6개월이상",sum:1},{k:"bm3u",l:"3개월미만",sum:1},{k:"bm36",l:"3~6개월",sum:1},{k:"bm6o",l:"6개월이상",sum:1}],
      note:"종계용도는 위 '농가 기본정보'에서 선택합니다(육용종계01~토종닭원종계06). 종계 마릿수는 합계에 포함됩니다."}
   ], inspect:fowlInspect },

 duck:{ label:"오리", unit:"수", change:CHANGE_FOWL, baseExtra:[],
   tables:[
     {id:"head",title:"사육마릿수",total:true,
      groups:[["육용오리",2],["종오리",2]],
      cols:[{k:"dm45u",l:"45일미만",sum:1},{k:"dm45o",l:"45일이상",sum:1},{k:"db6u",l:"6개월미만",sum:1},{k:"db6o",l:"6개월이상",sum:1}],
      note:"합계 = 육용오리 + 종오리. 함께 사육 시 많은 쪽만 조사(작성요령)."}
   ], inspect:fowlInspect }
};

/* ===== 내검 임계값(소속기관 기준으로 조정) ===== */
const RULE={ pig:{litterMin:11,litterMax:14,deadRate:0.15,pregFarrowLo:0.7,pregFarrowHi:1.3,turnLo:0.3,turnHi:0.9,qoqPct:30}, fowl:{qoqPct:30} };

/* ===== 상태 ===== */
let SP="pig", CFG=SPCFG.pig, M=blankModel();
function allCols(){ let a=[]; CFG.tables.forEach(t=>a=a.concat(t.cols)); return a; }
function sumKeys(){ return allCols().filter(c=>c.sum).map(c=>c.k); }
function blankRow(){ const r={}; allCols().forEach(c=>{ if(!c.auto) r[c.k]=null; }); return r; }
function blankModel(){ const d={}; PERIODS.forEach(([k])=>d[k]=blankRow()); return {species:SP,base:{},data:d,status:"작성중"}; }
function cur(){ return $("period").value; }
function yr(){ return ($("year").value||"").trim(); }
function storeKey(f){ return "dudang_gachuk_"+SP+"_"+(f||"_default"); }
function gv(r,k){ const v=r?r[k]:null; return (v===null||v===undefined||v==="")?null:+v; }
function rowTotal(r){ let s=0,any=false; sumKeys().forEach(k=>{ const v=gv(r,k); if(v!==null){s+=v;any=true;} }); return any?s:null; }
function autoVal(r,col){ let s=0,any=false; (col.auto||[]).forEach(k=>{ const v=gv(r,k); if(v!==null){s+=v;any=true;} }); return any?s:null; }

/* ===== 기본정보 렌더(접기카드) ===== */
function baseFields(){ return BASE_COMMON.concat(CFG.change?[["change","변동사항","sel:변동"]]:[]).concat(CFG.baseExtra||[]); }
function buildBase(){
  let h=""; baseFields().forEach(([k,l,opt])=>{
    const span=(opt==="span2")?"grid-column:span 2":"";
    let ctrl;
    if((opt||"").indexOf("sel:")===0){ const kind=opt.slice(4); const list=kind==="방법"?METHOD_OPTS:kind==="변동"?CFG.change:kind==="종계"?BREEDUSE:[];
      ctrl=`<select data-b='${k}'><option value=''>선택</option>${list.map(([v,t])=>`<option value='${v}'>${t}</option>`).join("")}</select>`; }
    else ctrl=`<input data-b='${k}' ${k.indexOf("Tel")>=0?"inputmode='tel'":""}>`;
    h+=`<div class='fld' style='${span}'><label>${l}</label>${ctrl}</div>`;
  });
  $("baseGrid").innerHTML=h;
  document.querySelectorAll("[data-b]").forEach(el=>{ el.value=(M.base[el.dataset.b]||""); });
  updateBaseSummary();
}
function updateBaseSummary(){ const b=M.base||{}; const parts=[]; if(b.owner)parts.push(b.owner); if(b.sido||b.sigungu)parts.push((b.sido||"")+(b.sigungu?" "+b.sigungu:"")); if(b.ledgerNo)parts.push("대장"+b.ledgerNo); $("baseSummary").textContent=parts.length?("· "+parts.join(" · ")):"· (접힘 — 열어서 입력)"; }

/* ===== 표 렌더 ===== */
function buildTables(){
  const c=cur(); let H="";
  CFG.tables.forEach((t,ti)=>{
    H+=`<div class='card'><div class='lb'><span class='num'>${2+ti}</span>${t.title} <span class='sub'>단위: ${CFG.unit} · 현재 조사월만 입력(노랑), 과거는 저장자료 조회</span></div><div class='tbl-scroll'><table>`;
    // 헤더
    if(t.groups){
      let g1="<tr><th rowspan='2'>조사시기</th>"; t.groups.forEach(([n,sp])=>g1+=`<th colspan='${sp}'>${n}</th>`); if(t.total)g1+="<th rowspan='2'>합계<br><span class='sub'>자동</span></th>"; g1+="</tr>";
      let g2="<tr>"+t.cols.map(col=>`<th>${col.l}</th>`).join("")+"</tr>";
      H+=g1+g2;
    } else {
      H+="<tr><th>조사시기</th>"+t.cols.map(col=>`<th>${col.l}</th>`).join("")+(t.total?"<th>합계<br><span class='sub'>자동</span></th>":"")+"</tr>";
    }
    // 행
    PERIODS.forEach(([pk,pl])=>{ const r=M.data[pk]||{}; const isCur=(pk===c);
      H+=`<tr class='${isCur?"cur":""}'><td class='hd'>${pl}${isCur?" ✎":""}</td>`;
      t.cols.forEach(col=>{ if(col.auto){ const v=autoVal(r,col); H+=`<td class='auto' data-auto='${t.id}:${pk}:${col.k}'>${v==null?"":nf(v)}</td>`; return; }
        const v=(r[col.k]==null?"":r[col.k]); const step=col.pct?"0.1":"1";
        H+=`<td><input type='number' inputmode='decimal' min='0' ${col.pct?"max='100'":""} step='${step}' data-pk='${pk}' data-f='${col.k}' value='${v}' ${isCur?"":"readonly"}></td>`; });
      if(t.total) H+=`<td class='auto' data-tot='${pk}'>${rowTotal(r)==null?"":nf(rowTotal(r))}</td>`;
      H+="</tr>";
    });
    H+=`</table></div>${t.note?`<div class='note'>※ ${t.note}</div>`:""}</div>`;
  });
  $("tables").innerHTML=H;
}
function recalc(){
  PERIODS.forEach(([pk])=>{ const r=M.data[pk]||{};
    document.querySelectorAll(`[data-tot='${pk}']`).forEach(el=>el.textContent=rowTotal(r)==null?"":nf(rowTotal(r)));
    CFG.tables.forEach(t=>t.cols.forEach(col=>{ if(col.auto){ const el=document.querySelector(`[data-auto='${t.id}:${pk}:${col.k}']`); if(el){ const v=autoVal(r,col); el.textContent=v==null?"":nf(v); } } }));
  });
}

/* ===== 입력 ===== */
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset&&el.dataset.pk&&el.dataset.f){ const r=M.data[el.dataset.pk]; if(r){ r[el.dataset.f]=(el.value===""?null:+el.value); recalc(); scheduleInspect(); } }
  else if(el.dataset&&el.dataset.b){ M.base[el.dataset.b]=el.value; updateBaseSummary(); }
});
document.addEventListener("change",e=>{ if(e.target.dataset&&e.target.dataset.b){ M.base[e.target.dataset.b]=e.target.value; updateBaseSummary(); } });

/* ===== 내검 ===== */
let _inspT=null; function scheduleInspect(){ clearTimeout(_inspT); _inspT=setTimeout(inspect,400); }
function inspect(){ const fn=CFG.inspect; const msgs=fn?fn():[]; renderChk(msgs); }
function baseNeg(r){ const m=[]; allCols().forEach(col=>{ if(col.auto)return; const v=r[col.k]; if(v!==null&&v<0) m.push({lv:"err",t:"음수 입력",body:`'${esc(col.l)}' 값이 음수입니다.`,focus:{pk:cur(),f:col.k}}); }); return m; }
function qoqCheck(r,pr,pct){ const m=[]; if(pr){ const t=rowTotal(r),p=rowTotal(pr); if(t!==null&&p!==null&&p>0){ const q=(t-p)/p*100; const line=`전분기 대비 전체 사육마릿수 ${q>=0?"+":""}${Math.round(q*10)/10}% (${nf(p)} → ${nf(t)}).`; if(Math.abs(q)>=pct) m.push({lv:"att",t:"전분기 대비 급변 주의",body:line+" 입식·출하·규모변동 사유를 확인하세요."}); else m.push({lv:"info",t:"전분기 대비 증감",body:line}); } } return m; }

function pigInspect(){ const R=RULE.pig, c=cur(), r=M.data[c]||{}, pr=prevOf[c]?M.data[prevOf[c]]:null; let m=baseNeg(r);
  const f68=gv(r,"f68"),cand=gv(r,"cand"),sow=gv(r,"sow"),prod=gv(r,"prod"),dead=gv(r,"dead"),farrow=gv(r,"farrow");
  if(cand!==null&&f68!==null&&cand>f68) m.push({lv:"err",t:"후보돈 초과",body:`후보돈(${nf(cand)})이 6~8개월 암컷(${nf(f68)})보다 많습니다.`,focus:{pk:c,f:"cand"}});
  if(prod!==null&&farrow!==null){ if(farrow===0&&prod>0) m.push({lv:"att",t:"분만모돈 확인",body:`생산(${nf(prod)}두)이 있는데 분만한 모돈이 0입니다.`,focus:{pk:c,f:"farrow"}});
    else if(farrow>0){ const lt=prod/farrow; if(lt<R.litterMin||lt>R.litterMax) m.push({lv:"att",t:"두당 생산마릿수 확인",body:`분만모돈당 생산 = <b>${Math.round(lt*10)/10}두</b> (생산 ${nf(prod)} ÷ 분만모돈 ${nf(farrow)}). 보통 ${R.litterMin}~${R.litterMax}두 — 확인하세요.`,focus:{pk:c,f:"prod"}}); else m.push({lv:"good",t:"두당 생산마릿수 적정",body:`분만모돈당 ${Math.round(lt*10)/10}두 (정상 ${R.litterMin}~${R.litterMax}).`}); } }
  if(dead!==null&&prod!==null&&prod>0){ const dr=dead/prod; if(dr>R.deadRate) m.push({lv:"att",t:"폐사 과다 확인",body:`폐사(${nf(dead)})가 생산(${nf(prod)}) 대비 <b>${Math.round(dr*100)}%</b>(기준 ${Math.round(R.deadRate*100)}% 초과). 질병·사고 확인.`,focus:{pk:c,f:"dead"}}); }
  if(pr){ const pp=autoVal(pr,{auto:["preg1","preg2","preg3"]}); if(pp!==null&&pp>0&&farrow!==null){ const ra=farrow/pp; if(ra<R.pregFarrowLo||ra>R.pregFarrowHi) m.push({lv:"att",t:"임신↔분만 관계 확인",body:`이번 분만모돈(${nf(farrow)})이 전분기 임신모돈 계(${nf(pp)}) 대비 <b>${Math.round(ra*100)}%</b> (정상 ${Math.round(R.pregFarrowLo*100)}~${Math.round(R.pregFarrowHi*100)}%).`,focus:{pk:c,f:"farrow"}}); } }
  if(sow!==null&&sow>0&&farrow!==null){ const tu=farrow/sow; m.push({lv:"info",t:"모돈 회전율(분기)",body:`분만모돈 ÷ 전체모돈 = <b>${Math.round(tu*100)}%</b> (${nf(farrow)} ÷ ${nf(sow)}).`}); if(tu<R.turnLo||tu>R.turnHi) m.push({lv:"att",t:"모돈 회전율 확인",body:`회전율 ${Math.round(tu*100)}%가 통상(${Math.round(R.turnLo*100)}~${Math.round(R.turnHi*100)}%)을 벗어납니다.`,focus:{pk:c,f:"farrow"}}); }
  m=m.concat(qoqCheck(r,pr,R.qoqPct)); return m;
}
function fowlInspect(){ const R=RULE.fowl, c=cur(), r=M.data[c]||{}, pr=prevOf[c]?M.data[prevOf[c]]:null; let m=baseNeg(r);
  if(SP==="chicken"){ const er=gv(r,"eggRate"); if(er!==null&&(er<0||er>100)) m.push({lv:"err",t:"가담율 범위 오류",body:`계란 생산가담율(${er}%)은 0~100% 범위여야 합니다.`,focus:{pk:c,f:"eggRate"}});
    const l6o=gv(r,"l6o"),egg=gv(r,"eggProd"); if(l6o!==null&&l6o>0&&(egg===null||egg===0)) m.push({lv:"att",t:"계란 생산량 확인",body:`산란계 6개월↑(${nf(l6o)}수)이 있는데 1일 평균 식용계란 생산량이 비어있습니다.`,focus:{pk:c,f:"eggProd"}}); }
  m=m.concat(qoqCheck(r,pr,R.qoqPct)); return m;
}
function renderChk(msgs){ const box=$("chkBox"); if(!msgs.length){ box.innerHTML="<div class='chk good'><span class='t'>✅ 검토 완료</span> — 발견된 오류·주의 항목이 없습니다.</div>"; return; }
  const ord={err:0,att:1,info:2,good:3}, ic={err:"🔴 오류",att:"🟠 확인 필요",info:"🟡 정보",good:"🟢 정상"}; msgs.sort((a,b)=>ord[a.lv]-ord[b.lv]);
  box.innerHTML=msgs.map((mm,i)=>`<div class='chk ${mm.lv}'><span class='t'>${ic[mm.lv]} ${mm.t}</span> ${mm.body}${mm.focus?` <a data-fi='${i}'>▶ 입력칸으로</a>`:""}</div>`).join("");
  box.querySelectorAll("[data-fi]").forEach(a=>a.onclick=()=>{ const mm=msgs[+a.dataset.fi]; const el=document.querySelector(`input[data-pk='${mm.focus.pk}'][data-f='${mm.focus.f}']`); if(el){ if(!$("baseCard").contains(el)){} el.scrollIntoView({block:"center"}); el.focus(); } });
}

/* ===== 저장/불러오기(암호화) ===== */
function loadStore(f){ try{ const raw=localStorage.getItem(storeKey(f)); if(!raw) return {}; return JSON.parse(decStr(raw)); }catch(e){ return {}; } }
function saveStore(f,obj){ try{ localStorage.setItem(storeKey(f),encStr(JSON.stringify(obj))); }catch(e){} }
function collectBase(){ const b={}; document.querySelectorAll("[data-b]").forEach(el=>b[el.dataset.b]=el.value); M.base=Object.assign(M.base||{},b); }
function doSave(){ const f=$("farm").value.trim(); if(!f){ alert("농장명을 입력하세요."); return; } collectBase();
  const store=loadStore(f), y=yr(); M.species=SP; store[y]=JSON.parse(JSON.stringify(M)); saveStore(f,store); refreshList(); toast("저장되었습니다(암호화)"); }
function doLoad(f,y){ const store=loadStore(f), rec=store[y]; if(!rec) return false;
  M=Object.assign(blankModel(),rec); if(!M.data)M.data=blankModel().data; PERIODS.forEach(([k])=>{ if(!M.data[k])M.data[k]=blankRow(); });
  $("farm").value=f; $("year").value=y; buildBase(); buildTables(); recalc(); inspect(); hsub(); return true; }
function refreshList(){ const sel=$("loadList"), keep=sel.value; let o="<option value=''>— 저장 농가·연도 불러오기 —</option>";
  try{ const pfx="dudang_gachuk_"+SP+"_"; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(pfx)===0){ const f=k.slice(pfx.length); const store=loadStore(f); Object.keys(store).sort().forEach(y=>{ o+=`<option value='${encodeURIComponent(f)}|${y}'>${f} · ${y}년</option>`; }); } } }catch(e){}
  sel.innerHTML=o; sel.value=keep; }
function hsub(){ $("hSub").textContent=`${CFG.label} · ${$("farm").value.trim()||"농가 미선택"} · ${yr()}년 ${PERIODS.find(p=>p[0]===cur())[1]}`; }

/* ===== 축종 전환 ===== */
function setSpecies(sp){ if(!SPCFG[sp])return; SP=sp; CFG=SPCFG[sp]; M=blankModel();
  document.querySelectorAll("#chips .chip").forEach(ch=>ch.classList.toggle("on",ch.dataset.sp===sp));
  buildBase(); buildTables(); recalc(); $("chkBox").innerHTML="<div class='sub'>🔍 값을 입력하면 자동으로 검토합니다.</div>"; $("numChk").textContent=2+CFG.tables.length; refreshList(); hsub();
}

/* ===== Excel / CSV ===== */
function buildAOA(){ const aoa=[]; aoa.push([`가축동향조사표(${CFG.label})`,$("farm").value.trim(),yr()+"년"]); aoa.push([]);
  aoa.push(["[농가기본정보]"]); baseFields().forEach(([k,l])=>aoa.push([esc(l),M.base[k]||""]));
  CFG.tables.forEach(t=>{ aoa.push([]); aoa.push(["["+esc(t.title)+"]"]);
    const head=["조사시기"].concat(t.cols.map(c=>esc(c.l))); if(t.total)head.push("합계"); aoa.push(head);
    PERIODS.forEach(([pk,pl])=>{ const r=M.data[pk]||{}; const row=[pl].concat(t.cols.map(c=>c.auto?(autoVal(r,c)==null?"":autoVal(r,c)):(r[c.k]==null?"":r[c.k]))); if(t.total)row.push(rowTotal(r)==null?"":rowTotal(r)); aoa.push(row); });
  }); return aoa; }
function doXlsx(){ collectBase(); const ws=XLSX.utils.aoa_to_sheet(buildAOA()), wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,CFG.label); XLSX.writeFile(wb,`가축동향_${CFG.label}_${$("farm").value.trim()||"농가"}_${yr()}.xlsx`); }
function doCsv(){ collectBase(); const csv="﻿"+buildAOA().map(row=>row.map(c=>{ const s=(c==null?"":String(c)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`가축동향_${CFG.label}_${$("farm").value.trim()||"농가"}_${yr()}.csv`; a.click(); }

/* ===== 이벤트 ===== */
$("btnSave").onclick=doSave;
$("btnLoad").onclick=()=>{ const v=$("loadList").value; if(!v){ alert("불러올 농가·연도를 선택하세요."); return; } const [f,y]=v.split("|"); if(doLoad(decodeURIComponent(f),y)) toast("불러왔습니다"); };
$("btnDel").onclick=()=>{ const v=$("loadList").value; if(!v){ alert("삭제할 농가·연도를 선택하세요."); return; } const [fe,y]=v.split("|"), f=decodeURIComponent(fe); if(!confirm(`${f} · ${y}년 자료를 삭제할까요?`))return; const store=loadStore(f); delete store[y]; if(Object.keys(store).length) saveStore(f,store); else localStorage.removeItem(storeKey(f)); refreshList(); toast("삭제되었습니다"); };
$("btnInspect").onclick=()=>{ inspect(); toast("내검 완료"); $("chkBox").scrollIntoView({block:"center"}); };
$("btnPrint").onclick=()=>{ collectBase(); window.print(); };
$("btnXlsx").onclick=doXlsx;
$("btnCsv").onclick=doCsv;
$("period").onchange=()=>{ buildTables(); recalc(); inspect(); hsub(); };
$("year").onchange=hsub;
document.querySelectorAll("#chips .chip").forEach(ch=>ch.onclick=()=>setSpecies(ch.dataset.sp));

/* ===== 초기 ===== */
setSpecies("pig");
window.addEventListener("pagehide",()=>{ const f=$("farm").value.trim(); if(f){ collectBase(); const store=loadStore(f); store[yr()]=JSON.parse(JSON.stringify(M)); saveStore(f,store); } });
</script>
