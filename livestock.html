<style>
  :root{--navy:#1a365d;--navy2:#2c5282;--blue:#2b6cb0;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--text:#1a202c;--muted:#718096;}
  *{box-sizing:border-box;} html,body{margin:0;}
  body{font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--text);background:var(--bg);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;}
  .hrow{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .back{color:#fff;font-size:22px;font-weight:700;line-height:1;padding:2px 6px;}
  header h1{font-size:19px;margin:0;flex:1;}
  .home{color:#bcd4ef;font-size:14px;font-weight:600;white-space:nowrap;}
  main{max-width:980px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card .lb{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}
  .card .lb .num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--blue);color:#fff;border-radius:50%;font-size:12px;margin-right:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chips button{border:1px solid #cbd5e0;background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .chips button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  #office button.reset{background:#fff;color:#c0392b;border-color:#e6a6a0;}
  #sido button{padding:7px 11px;font-size:13px;}
  #sido button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  #sido button.on{color:#fff;border-color:transparent;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  select{padding:9px 12px;font-size:15px;border:1px solid #cbd5e0;border-radius:9px;background:#fff;}
  .sido-note{font-size:13px;color:var(--muted);margin-top:8px;}
  .sido-note b{color:var(--navy);}
  .chart-wrap{position:relative;height:340px;}
  .msg{color:var(--muted);font-size:14px;text-align:center;padding:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  th,td{border:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap;}
  th{background:#eef3fb;color:var(--navy);}
  td.reg,th.reg{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;}
  th.reg{background:#eef3fb;}
  .tbl-scroll{overflow-x:auto;}
  .src{color:var(--muted);font-size:12px;margin-top:10px;}
  /* 지역별 마리수 분포 지도 (disease.html 사육두수 레이어 재사용) */
  #mapWrap{position:relative;margin-top:2px;}
  #map{width:100%;height:440px;border-radius:12px;border:1px solid var(--line);background:#e9edf1;}
  #mapMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(20,20,22,.78);color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:12px;text-align:center;max-width:80%;}
  #mapMsg.hidden,#lvTitle.hidden{display:none;}
  #lvTitle{position:absolute;top:8px;left:8px;z-index:5;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:13px;font-weight:800;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18);}
  #lvTitle .pd{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;}
  .lv-ov{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .lv-bubble{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(47,168,79,.75);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .lv-bubble span{color:#fff;font-weight:800;font-size:11px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .lv-name{margin-top:3px;font-size:12.5px;font-weight:800;color:#fff;background:rgba(20,44,72,.94);border:1.5px solid #fff;border-radius:8px;padding:1px 8px;line-height:1.5;white-space:nowrap;letter-spacing:-.2px;box-shadow:0 1px 4px rgba(0,0,0,.45);}
  .mapnote{font-size:12px;color:var(--muted);margin-top:8px;}
  .unit{font-size:12px;color:var(--muted);font-weight:500;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a365d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d7a99b2a71a456ad75815e664f3dda20&libraries=services&autoload=false"></script>
</head>
<body>
<header><div class="hrow">
  <a class="back" href="#" onclick="if(history.length>1){history.back();}else{location.href='index.html';}return false;" aria-label="뒤로">←</a>
  <h1>🐮 가축마리수 조회</h1>
  <a class="home" href="index.html">🏠 두당홈</a>
</div></header>
<main>
  <div class="card">
    <div class="lb"><span class="num">1</span>축종 선택</div>
    <div class="chips" id="species"></div>
  </div>
  <div class="card">
    <div class="lb"><span class="num">2</span>지역 선택 · 전국은 항상 표시</div>
    <div class="chips" id="office"></div>
    <div class="chips" id="sido" style="margin-top:9px"></div>
    <div class="sido-note" id="sidoNote"></div>
  </div>
  <div class="card">
    <div class="lb"><span class="num">3</span>조회기간</div>
    <div class="row">
      <select id="periodN">
        <option value="4">최근 4회(분기)</option>
        <option value="5" selected>최근 5회(분기)</option>
        <option value="8">최근 8회(2년)</option>
        <option value="12">최근 12회(3년)</option>
        <option value="20">최근 20회(5년)</option>
      </select>
      <span class="unit">단위: 마리</span>
    </div>
  </div>

  <div class="card">
    <div class="lb">🗺️ 지역별 마리수 분포 <span class="unit" id="mapSub"></span></div>
    <div id="mapWrap">
      <div id="lvTitle" class="hidden"></div>
      <div id="map"></div>
      <div id="mapMsg" class="hidden"></div>
    </div>
    <div class="mapnote">※ 원 크기는 지역별 사육 마리수에 비례합니다. 위 <b>축종</b>을 바꾸면 지도도 함께 바뀝니다. 지도는 <b>인터넷 연결(github.io 배포본)</b>에서 표시됩니다.</div>
  </div>

  <div class="card">
    <div class="lb">📈 사육두수 추이 <span class="unit" id="chartSub"></span></div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="msg" id="chartMsg" hidden></div>
  </div>

  <div class="card">
    <div class="lb">📋 통계표 <span class="unit">(단위: 마리)</span></div>
    <div class="tbl-scroll"><table id="tbl"></table></div>
    <div class="src" id="src"></div>
  </div>
</main>

<script>
const RELAY="https://induowdrembd3zhtym3ke6prcy0cgajf.lambda-url.ap-northeast-2.on.aws/";
const SPECIES=[
  {id:"hanwoo",label:"한우",emoji:"🐮"},{id:"yukwoo",label:"육우",emoji:"🐄"},
  {id:"dairy",label:"젖소",emoji:"🥛"},{id:"pig",label:"돼지",emoji:"🐷"},
  {id:"layer",label:"산란계",emoji:"🥚"},{id:"broiler",label:"육계",emoji:"🐔"},
  {id:"duck",label:"오리",emoji:"🦆"}
];
const OFFICE={"동북청":["대구","경북","강원"],"동남청":["부산","울산","경남"],"경인청":["서울","인천","경기"],"충청청":["대전","세종","충남","충북"],"호남청":["전북","전남","광주","제주"]};
// 17개 시도(청 순서로 묶어 색 배정)
const SIDO=[
 {n:"서울",c:"#e74c3c"},{n:"인천",c:"#e67e22"},{n:"경기",c:"#f1c40f"},
 {n:"대전",c:"#16a085"},{n:"세종",c:"#1abc9c"},{n:"충남",c:"#27ae60"},{n:"충북",c:"#2ecc71"},
 {n:"대구",c:"#2980b9"},{n:"경북",c:"#3498db"},{n:"강원",c:"#5dade2"},
 {n:"부산",c:"#8e44ad"},{n:"울산",c:"#9b59b6"},{n:"경남",c:"#c39bd3"},
 {n:"전북",c:"#d35400"},{n:"전남",c:"#e59866"},{n:"광주",c:"#b9770e"},{n:"제주",c:"#7f8c8d"}
];
const SIDO_COLOR={}; SIDO.forEach(s=>SIDO_COLOR[s.n]=s.c); SIDO_COLOR["전국"]="#1a365d";
const colorFor=(nm)=>SIDO_COLOR[nm]||"#95a5a6";
const $=id=>document.getElementById(id);
let curSp="hanwoo", chart=null;
let sel=new Set();  // 선택된 시도(전국은 항상 그래프에 포함)

function officeOf(name){ for(const o in OFFICE){ if(OFFICE[o].indexOf(name)>=0) return o; } return ""; }
function renderChips(){
  $("species").innerHTML=SPECIES.map(s=>`<button data-sp="${s.id}"${s.id===curSp?' class="on"':''}>${s.emoji} ${s.label}</button>`).join("");
  // 청 단축버튼 + 초기화
  let off=Object.keys(OFFICE).map(o=>{
    const on=OFFICE[o].every(x=>sel.has(x)) && sel.size===OFFICE[o].length;
    return `<button data-off="${o}"${on?' class="on"':''}>${o}</button>`;
  }).join("");
  off+=`<button class="reset" data-reset="1">↺ 초기화(전국만)</button>`;
  $("office").innerHTML=off;
  // 17개 시도 색깔칩
  $("sido").innerHTML=SIDO.map(s=>{
    const on=sel.has(s.n);
    return `<button data-sido="${s.n}"${on?' class="on"':''}`+(on?` style="background:${s.c}"`:'')+`><span class="dot" style="background:${s.c}"></span>${s.n}</button>`;
  }).join("");
  $("species").querySelectorAll("button").forEach(b=>b.onclick=()=>{curSp=b.dataset.sp;renderChips();load();renderLivestockMap();});
  $("office").querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{ sel=new Set(OFFICE[b.dataset.off]); renderChips(); load(); });
  $("office").querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{ sel=new Set(); renderChips(); load(); });
  // 개별 시도 클릭 → 해당 시도만 선택
  $("sido").querySelectorAll("[data-sido]").forEach(b=>b.onclick=()=>{ sel=new Set([b.dataset.sido]); renderChips(); load(); });
  // 안내문
  if(sel.size===0){ $("sidoNote").innerHTML="전국 사육두수를 표시합니다. (청 또는 시도를 누르면 함께 비교)"; }
  else{ const arr=[...sel]; const off2=arr.length>1?officeOf(arr[0]):""; $("sidoNote").innerHTML=`선택: <b>${arr.join(" · ")}</b>`+(off2&&arr.every(x=>officeOf(x)===off2)?` <span style="color:#a0aec0">(${off2})</span>`:"")+` <span style="color:#a0aec0">+ 전국</span>`; }
}
function fmtQ(prd){ const m=/^(\d{4})(\d{2})$/.exec(prd); if(m){ const q=parseInt(m[2],10); return m[1].slice(2)+"'"+(q>=1&&q<=4?q+"Q":m[2]); } return prd; }
function fmtQfull(prd){ const m=/^(\d{4})(\d{2})$/.exec(prd); if(m){ const q=parseInt(m[2],10); return m[1]+"년 "+(q>=1&&q<=4?q+"분기":m[2]); } return prd; }
function fmtNum(v){ return v==null?"–":Number(v).toLocaleString(); }

function regionsToShow(){
  const list=["전국"];
  SIDO.forEach(s=>{ if(sel.has(s.n)) list.push(s.n); });  // 시도 표준 순서 유지
  return list;
}

async function load(){
  const n=$("periodN").value;
  const spLabel=(SPECIES.find(s=>s.id===curSp)||{}).label||"";
  $("chartSub").textContent="· "+spLabel;
  $("chartMsg").hidden=true;
  try{
    const r=await fetch(RELAY+"?mode=livestock_series&species="+encodeURIComponent(curSp)+"&n="+encodeURIComponent(n),{cache:"no-store"});
    const d=await r.json();
    if(!d||!d.ok||!d.periods||!d.periods.length) throw 0;
    draw(d, spLabel);
  }catch(e){
    if(chart){chart.destroy();chart=null;}
    $("tbl").innerHTML="";
    $("chartMsg").hidden=false;
    $("chartMsg").textContent="데이터를 불러오지 못했습니다. 잠시 후 다시 시도하거나, github.io 배포본에서 확인해 주세요.";
  }
}

function draw(d, spLabel){
  const periods=d.periods;               // 과거→최신
  const regions=regionsToShow().filter(rg=> d.data[rg]);
  const labels=periods.map(fmtQ);
  const datasets=regions.map((rg)=>({
    label:rg, data:d.data[rg], borderColor:colorFor(rg),
    backgroundColor:colorFor(rg), borderWidth:rg==="전국"?3.5:2,
    tension:.25, pointRadius:3, pointHoverRadius:5, spanGaps:true,
    borderDash: rg==="전국"?[6,3]:[]
  }));
  $("chartMsg").hidden=true;
  if(chart) chart.destroy();
  chart=new Chart($("chart"),{
    type:"line",
    data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{position:"bottom",labels:{boxWidth:14,font:{size:12}}},
        tooltip:{callbacks:{
          title:(items)=>fmtQfull(periods[items[0].dataIndex]),
          label:(it)=>it.dataset.label+": "+fmtNum(it.parsed.y)+" 마리"
        }}
      },
      scales:{
        y:{ticks:{callback:v=>Number(v).toLocaleString()}},
        x:{ticks:{font:{size:11}}}
      }
    }
  });
  // 통계표: 행=지역, 열=분기(과거→최신)
  let h="<tr><th class='reg'>지역</th>"+periods.map(p=>`<th>${fmtQfull(p)}</th>`).join("")+"</tr>";
  regions.forEach(rg=>{
    h+=`<tr><td class='reg'><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colorFor(rg)};margin-right:5px;vertical-align:middle"></span>${rg}</td>`+ (d.data[rg]||[]).map(v=>`<td>${fmtNum(v)}</td>`).join("") +"</tr>";
  });
  $("tbl").innerHTML=h;
  const last=periods[periods.length-1];
  $("src").textContent="출처: KOSIS 가축동향조사(통계청) · 최신 "+fmtQfull(last)+" 기준 · 자동 갱신";
}

$("periodN").addEventListener("change",load);

/* ===== 지역별 마리수 분포 지도 (disease.html의 축종별 사육두수 레이어 재사용) =====
   같은 relay(mode=livestock)의 시도별 스냅샷을 카카오 지도에 마리수 비례 원으로 표시. */
const ANCHORS=[
 {name:"서울",lat:37.56,lng:126.98},{name:"인천",lat:37.46,lng:126.70},{name:"경기",lat:37.20,lng:127.60},
 {name:"강원",lat:37.55,lng:128.45},{name:"충북",lat:36.85,lng:127.80},{name:"충남",lat:36.55,lng:126.75},
 {name:"대전",lat:36.30,lng:127.62},{name:"세종",lat:36.60,lng:127.26},{name:"전북",lat:35.72,lng:127.15},
 {name:"전남",lat:34.60,lng:126.55},{name:"광주",lat:35.16,lng:127.05},{name:"경북",lat:36.35,lng:128.85},
 {name:"대구",lat:35.87,lng:128.60},{name:"경남",lat:35.10,lng:128.10},{name:"부산",lat:35.05,lng:129.05},
 {name:"울산",lat:35.54,lng:129.31},{name:"제주",lat:33.40,lng:126.55}
];
let _map=null,_overlays=[],LIVESTOCK={},LV_PERIOD="";
function fmtCount(n){ if(n>=10000) return (n/10000).toFixed(n>=100000?0:1)+"만"; return String(n); }
function fmtPeriodMap(p){ if(!p) return ""; const m=/^(\d{4})(\d{2})$/.exec(p); if(m){ const q=parseInt(m[2],10); return m[1]+"년"+((q>=1&&q<=4)?(" "+q+"분기"):""); } return p; }
function showMapMsg(t){ const e=$("mapMsg"); if(e){ e.textContent=t; e.classList.remove("hidden"); } }
function hideMapMsg(){ const e=$("mapMsg"); if(e) e.classList.add("hidden"); }
function clearOverlays(){ _overlays.forEach(o=>o.setMap(null)); _overlays=[]; }
function renderLivestockMap(){
  if(!_map) return;
  clearOverlays();
  const sp=SPECIES.find(s=>s.id===curSp)||{};
  const pd=fmtPeriodMap(LV_PERIOD);
  const lt=$("lvTitle"); lt.innerHTML=(sp.emoji||"")+" "+(sp.label||"")+" 사육 마리수"+(pd?`<span class="pd">${pd} 기준</span>`:""); lt.classList.remove("hidden");
  $("mapSub").textContent=pd?("· "+pd+" 기준"):("· "+(sp.label||""));
  const data=LIVESTOCK[curSp];
  if(!data || !Object.keys(data).length){ showMapMsg((sp.emoji||"")+" "+(sp.label||"")+" 사육 마리수 — 데이터 연동 준비 중"); return; }
  hideMapMsg();
  const vals=Object.values(data).filter(v=>v>0); const max=Math.max(...vals,1);
  ANCHORS.forEach(a=>{
    const cnt=data[a.name]; if(!cnt) return;
    const r=Math.round(9+24*Math.sqrt(cnt/max));
    const wrap=document.createElement("div"); wrap.className="lv-ov";
    const d=document.createElement("div"); d.className="lv-bubble"; d.style.width=d.style.height=(r*2)+"px";
    d.innerHTML=`<span>${fmtCount(cnt)}</span>`;
    const nm=document.createElement("div"); nm.className="lv-name"; nm.textContent=a.name;
    wrap.appendChild(d); wrap.appendChild(nm);
    const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(a.lat,a.lng),content:wrap,yAnchor:0.5,xAnchor:0.5});
    ov.setMap(_map); _overlays.push(ov);
  });
}
async function loadLivestockMap(){
  try{
    const r=await fetch(RELAY+"?mode=livestock",{cache:"no-store"});
    const d=await r.json();
    if(d && d.ok && d.data){ LIVESTOCK=d.data; LV_PERIOD=d.period||""; renderLivestockMap(); }
    else showMapMsg("지역별 마리수 데이터 연동 준비 중");
  }catch(e){ showMapMsg("지도 데이터를 불러오지 못했습니다. (인터넷 연결·github.io 배포본에서 표시됩니다)"); }
}
function initMap(){
  if(!window.kakao || !kakao.maps){ showMapMsg("지도는 인터넷 연결(github.io 배포본)에서 표시됩니다."); return; }
  kakao.maps.load(()=>{ _map=new kakao.maps.Map($("map"),{center:new kakao.maps.LatLng(36.3,127.8),level:13}); loadLivestockMap(); });
}

renderChips();
load();
