<style>
  :root{--navy:#1a365d;--navy2:#2c5282;--blue:#2b6cb0;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--text:#1a202c;--muted:#718096;--warn:#c05621;}
  *{box-sizing:border-box;} html,body{margin:0;}
  body{font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--text);background:var(--bg);line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;}
  .hrow{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .home{color:#bcd4ef;font-size:14px;font-weight:600;white-space:nowrap;}
  .back{color:#fff;font-size:22px;font-weight:700;padding:2px 6px;}
  header h1{font-size:19px;margin:0;flex:1;min-width:0;}
  main{max-width:900px;margin:0 auto;padding:16px;}
  .bc{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .bc a{color:var(--blue);font-weight:600;} .bc b{color:var(--navy);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;}
  .card:hover{border-color:#bcd0ea;box-shadow:0 4px 14px rgba(43,108,176,.12);}
  .card .ico{font-size:30px;} .card .t{font-size:17px;font-weight:700;margin-top:8px;} .card .d{font-size:13px;color:var(--muted);margin-top:4px;}
  .list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:8px;font-weight:600;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .item .hd{padding:13px 15px;cursor:pointer;font-size:16px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .item .hd .arw{margin-left:auto;color:#a0aec0;font-size:13px;transition:.15s;}
  .item.open .hd .arw{transform:rotate(90deg);}
  .item .body{display:none;padding:0 15px 15px;border-top:1px solid var(--line);}
  .item.open .body{display:block;}
  .qa{margin-top:12px;}
  .qa .q{font-size:13px;font-weight:700;color:var(--blue);}
  .qa .a{font-size:14px;margin-top:2px;}
  .qa.warn .q{color:var(--warn);}
  .qa.farm{background:#f7fafc;border-radius:8px;padding:8px 10px;}
  .rel span{display:inline-block;background:#edf2f7;border-radius:12px;padding:2px 9px;margin:6px 4px 0 0;font-size:12.5px;color:#4a5568;cursor:pointer;}
  .src{color:var(--muted);font-size:12px;margin-top:16px;border-top:1px solid var(--line);padding-top:10px;}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);}
  h3.sec{font-size:16px;margin:8px 0 12px;padding-left:10px;border-left:4px solid var(--blue);}
  @media(max-width:640px){ .cards{grid-template-columns:1fr;} }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a365d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header><div class="hrow">
  <a class="back" href="#" onclick="if(history.length>1){history.back();}else{location.href='index.html';}return false;" aria-label="뒤로">←</a>
  <h1>🧭 조사도우미</h1>
  <a class="home" href="index.html">🏠 홈</a>
</div></header>
<main id="main"><div class="msg">불러오는 중…</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":(""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])));
let DATA=null;
const P=new URLSearchParams(location.search);
function nav(survey,sp){ const u=new URL(location.href); u.search=""; if(survey)u.searchParams.set("survey",survey); if(sp)u.searchParams.set("s",sp); location.href=u; }

function render(){
  const sid=P.get("survey"), spid=P.get("s");
  if(!sid){ renderSurveys(); return; }
  const sv=DATA.surveys.find(x=>x.id===sid); if(!sv){ renderSurveys(); return; }
  if(!spid){ renderSpecies(sv); return; }
  const sp=sv.species.find(x=>x.id===spid); if(!sp){ renderSpecies(sv); return; }
  renderItems(sv,sp);
}
function renderSurveys(){
  $("main").innerHTML='<div class="bc"><b>조사도우미</b></div><h3 class="sec">어떤 조사를 도와드릴까요?</h3><div class="cards">'+
    DATA.surveys.map(s=>`<div class="card" onclick="nav('${s.id}')"><div class="ico">${s.emoji||"📋"}</div><div class="t">${esc(s.title)}</div><div class="d">${esc(s.desc||"")}</div></div>`).join("")+
    '</div>'+srcHtml();
}
function renderSpecies(sv){
  $("main").innerHTML=`<div class="bc"><a href="helper.html">조사도우미</a> › <b>${esc(sv.title)}</b></div>`+
    `<h3 class="sec">축종을 선택하세요</h3><div class="list">`+
    sv.species.map(sp=>`<a onclick="nav('${sv.id}','${sp.id}')" style="cursor:pointer">${sp.emoji||"🐾"} ${esc(sp.title)}</a>`).join("")+
    (sv.species.length<2?'<div class="msg" style="margin-top:8px">다른 축종은 순차 추가 예정입니다.</div>':'')+
    '</div>'+srcHtml();
}
function renderItems(sv,sp){
  $("main").innerHTML=`<div class="bc"><a href="helper.html">조사도우미</a> › <a onclick="nav('${sv.id}')" style="cursor:pointer;color:var(--blue);font-weight:600">${esc(sv.title)}</a> › <b>${esc(sp.title)}</b></div>`+
    `<h3 class="sec">${sv.emoji} 조사항목 (항목을 눌러 확인)</h3><div id="items"></div>`+srcHtml();
  const box=$("items");
  sp.items.forEach(it=>{
    const el=document.createElement("div"); el.className="item";
    const rel=(it.terms||[]).map(t=>`<span onclick="event.stopPropagation();openTerm('${encodeURIComponent(t)}')">${esc(t)}</span>`).join("");
    el.innerHTML=`<div class="hd">${esc(it.item)}<span class="arw">▶</span></div>
      <div class="body">
        <div class="qa"><div class="q">무엇을 조사하나요?</div><div class="a">${esc(it.what)}</div></div>
        <div class="qa"><div class="q">왜 조사하나요?</div><div class="a">${esc(it.why)}</div></div>
        ${it.farmSay?`<div class="qa farm"><div class="q">농가에서는 이렇게 말해요</div><div class="a">${esc(it.farmSay)}</div></div>`:""}
        <div class="qa"><div class="q">✔ 확인할 점</div><div class="a">${esc(it.check)}</div></div>
        ${it.mistake?`<div class="qa warn"><div class="q">⚠ 자주 발생하는 오류</div><div class="a">${esc(it.mistake)}</div></div>`:""}
        ${rel?`<div class="qa rel"><div class="q">관련 용어</div>${rel}</div>`:""}
      </div>`;
    el.querySelector(".hd").onclick=()=>el.classList.toggle("open");
    box.appendChild(el);
  });
}
function openTerm(t){ location.href="terms.html?q="+t; }
function srcHtml(){ return DATA.source?`<div class="src">출처: ${esc(DATA.source)}${DATA.version?(" · "+esc(DATA.version)):""}</div>`:""; }

(async function(){
  try{ DATA=await (await fetch("data/helper.json",{cache:"no-store"})).json(); }
  catch(e){ $("main").innerHTML='<div class="msg">조사도우미 데이터를 불러오지 못했습니다.</div>'; return; }
  render();
})();
window.nav=nav; window.openTerm=openTerm;
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}</script>
