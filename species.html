<!-- species.html · 저장: 2026-08-28 14:41 KST -->
<!-- 두당 축종 배우기 · data/species/*.json 기반 콘텐츠 뷰어 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>축종 배우기 · 두당 頭當</title>
<style>
  :root{--navy:#1a365d;--navy2:#2c5282;--blue:#2b6cb0;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--text:#1a202c;--muted:#718096;--accent:#2b6cb0;}
  *{box-sizing:border-box;} html,body{margin:0;}
  body{font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--text);background:var(--bg);line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;}
  .hrow{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .home{color:#bcd4ef;font-size:14px;font-weight:600;}
  header h1{font-size:20px;margin:0;}
  header .cat{font-size:13px;color:#bcd4ef;}
  main{max-width:960px;margin:0 auto;padding:16px;}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .intro .t{font-size:15px;}
  .purpose{margin-top:8px;color:var(--muted);font-size:14px;}
  h3.sec{font-size:16px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--blue);}
  /* 타임라인 */
  .tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tl button{border:1px solid #cbd5e0;background:#fff;border-radius:20px;padding:7px 13px;font-size:13.5px;cursor:pointer;font-weight:600;}
  .tl button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .tl .arw{color:#a0aec0;font-size:12px;}
  .tl-detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;}
  .tl-detail .st{font-size:16px;font-weight:700;color:var(--navy);}
  .tl-detail .age{font-size:12px;color:#fff;background:var(--blue);border-radius:8px;padding:1px 8px;margin-left:6px;}
  .tl-detail .desc{margin:8px 0 10px;}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .kv .k{font-size:12px;color:var(--muted);}
  .kv .v{font-size:13.5px;}
  .kv .survey{grid-column:1/-1;background:#eef3fb;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--navy);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .box h4{margin:0 0 8px;font-size:14px;}
  ul{margin:6px 0;padding-left:18px;} li{margin:2px 0;font-size:14px;}
  .chips span{display:inline-block;background:#edf2f7;border-radius:12px;padding:3px 10px;margin:3px 4px 0 0;font-size:13px;color:#4a5568;}
  .survey-box{background:#f0f6ff;border:1px solid #cfe0f5;border-radius:12px;padding:14px;}
  .survey-box .lb{font-weight:700;color:var(--navy);font-size:13px;}
  .newbie{background:#fffaf0;border:1px solid #f0e0b8;border-radius:12px;padding:14px;font-size:14px;}
  .src{color:var(--muted);font-size:12px;margin-top:16px;border-top:1px solid var(--line);padding-top:10px;}
  .list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:8px;font-weight:600;}
  .soon{color:#a0aec0;font-size:12px;}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr;} .kv{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header><div class="hrow">
  <a class="home" href="index.html">← 두당 홈</a>
  <h1 id="hTitle">축종 배우기</h1>
  <span class="cat" id="hCat"></span>
</div></header>
<main id="main"><div class="msg">불러오는 중…</div></main>

<script>
const SPECIES=[
  {id:"hanwoo-breeding",title:"한우 번식우",emoji:"🐮"},
  {id:"hanwoo-fattening",title:"한우 비육우",emoji:"🐄"},
  {id:"beef-cattle",title:"육우",emoji:"🐂"},
  {id:"dairy",title:"젖소",emoji:"🥛"},
  {id:"pig",title:"비육돈",emoji:"🐖"},
  {id:"layer",title:"산란계",emoji:"🥚"},
  {id:"broiler",title:"육계",emoji:"🐔"},
];
const esc=s=>(s==null?"":(""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])));
const $=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get("s");

async function main(){
  if(!id){ renderList(); return; }
  try{
    const res=await fetch("data/species/"+id+".json",{cache:"no-store"});
    if(!res.ok) throw 0;
    render(await res.json());
  }catch(e){ renderMissing(); }
}
function renderList(){
  $("hTitle").textContent="축종 배우기";
  $("main").innerHTML='<h3 class="sec">축종을 선택하세요</h3><div class="list">'+
    SPECIES.map(s=>`<a href="species.html?s=${s.id}">${s.emoji} ${s.title}`+
      (s.id==="hanwoo-breeding"?"":' <span class="soon">· 준비 중</span>')+`</a>`).join("")+'</div>';
}
function renderMissing(){
  const s=SPECIES.find(x=>x.id===id);
  $("hTitle").textContent=(s?s.emoji+" "+s.title:"축종")+" 배우기";
  $("main").innerHTML='<div class="msg">이 축종 콘텐츠는 <b>준비 중</b>입니다.<br>현재 <b>한우 번식우</b>가 시범 제작되어 있습니다.<br><br>'+
    '<a class="home" style="color:var(--blue)" href="species.html?s=hanwoo-breeding">→ 한우 번식우 보기</a></div>';
}
function render(d){
  $("hTitle").textContent=(d.emoji||"")+" "+d.title;
  $("hCat").textContent=d.category?("· "+d.category):"";
  let h="";
  h+=`<div class="intro"><div class="t">${esc(d.intro)}</div><div class="purpose"><b>사육 목적:</b> ${esc(d.purpose)}</div></div>`;
  // 생애주기
  if(d.lifecycle&&d.lifecycle.length){
    h+='<h3 class="sec">가축의 생애 (단계를 눌러보세요)</h3><div class="tl" id="tl"></div><div id="tlDetail"></div>';
  }
  // 사료/시설
  h+='<div class="grid2">';
  if(d.feed) h+='<div class="box"><h4>🌾 주요 사료</h4><ul>'+d.feed.map(f=>`<li><b>${esc(f.name)}</b> — ${esc(f.desc)}</li>`).join("")+'</ul></div>';
  if(d.facility) h+='<div class="box"><h4>🏠 주요 시설</h4><ul>'+d.facility.map(x=>`<li>${esc(x)}</li>`).join("")+'</ul></div>';
  h+='</div>';
  if(d.rearing) h+=`<h3 class="sec">사육 방법</h3><div class="box">${esc(d.rearing)}</div>`;
  if(d.reproduction) h+=`<h3 class="sec">번식 과정</h3><div class="box">${esc(d.reproduction)}</div>`;
  if(d.shipping) h+=`<h3 class="sec">출하·판매</h3><div class="box">${esc(d.shipping)}</div>`;
  if(d.disease) h+=`<h3 class="sec">주요 질병</h3><div class="box chips">`+d.disease.map(x=>`<span>${esc(x)}</span>`).join("")+`</div>`;
  if(d.costStructure) h+=`<h3 class="sec">생산비 발생구조</h3><div class="box">${esc(d.costStructure)}</div>`;
  // 조사 관련
  if(d.surveyLivestock||d.surveyCost){
    h+='<h3 class="sec">조사와의 관계</h3>';
    if(d.surveyLivestock) h+=`<div class="survey-box" style="margin-bottom:8px"><div class="lb">📈 가축동향조사</div>${esc(d.surveyLivestock)}</div>`;
    if(d.surveyCost) h+=`<div class="survey-box"><div class="lb">💰 축산물생산비조사</div>${esc(d.surveyCost)} <a style="color:var(--blue);font-weight:600" href="chukbi.html">→ 생산비 집계·검토 열기</a></div>`;
  }
  if(d.terms) h+=`<h3 class="sec">관련 용어</h3><div class="box chips">`+d.terms.map(x=>`<span>${esc(x)}</span>`).join("")+`</div>`;
  if(d.newbie) h+=`<h3 class="sec">신규 조사원 유의사항</h3><div class="newbie">${esc(d.newbie)}</div>`;
  if(d.source) h+=`<div class="src">출처: ${esc(d.source)}${d.contentVersion?(" · 콘텐츠 "+esc(d.contentVersion)):""}${d.updatedAt?(" · "+esc(d.updatedAt)):""}</div>`;
  $("main").innerHTML=h;
  if(d.lifecycle&&d.lifecycle.length) buildTimeline(d.lifecycle);
}
function buildTimeline(lc){
  const tl=$("tl");
  lc.forEach((s,i)=>{ if(i)tl.insertAdjacentHTML("beforeend",'<span class="arw">▶</span>');
    const b=document.createElement("button"); b.textContent=s.stage; b.onclick=()=>showStage(lc,i,b); tl.appendChild(b); });
  showStage(lc,0,tl.querySelector("button"));
}
function showStage(lc,i,btn){
  document.querySelectorAll("#tl button").forEach(x=>x.classList.remove("on")); if(btn)btn.classList.add("on");
  const s=lc[i];
  const kv=[["주요 관리","care"],["주요 사료","feed"],["농가 작업","work"],["관련 시설","facility"],["발생 비용","cost"]]
    .filter(([_,k])=>s[k]).map(([lb,k])=>`<div><div class="k">${lb}</div><div class="v">${esc(s[k])}</div></div>`).join("");
  $("tlDetail").innerHTML=`<div class="tl-detail"><div class="st">${esc(s.stage)}<span class="age">${esc(s.age||"")}</span></div>`+
    `<div class="desc">${esc(s.desc||"")}</div><div class="kv">${kv}`+
    (s.survey?`<div class="survey">🔎 ${esc(s.survey)}</div>`:"")+`</div></div>`;
}
main();
</script>
</body>
</html>
